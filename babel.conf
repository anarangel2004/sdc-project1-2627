## Configuration file for the SDC 2026/27 Project 1 (replicated payment service)
## Any property can be overridden in the command line (e.g., crypto_name=node2 num_clients=20)

# Cryptographic material (see scripts/generate-keys.sh)
# crypto_name - the name of the replica; different for each replica, provide it in the command line
key_store_folder=crypto-material
key_store_password=password
trust_store=crypto-material/truststore.ks
trust_store_password=password
clients_key_store=crypto-material/clients.ks
clients_trust_store=crypto-material/clients-truststore.ks

# Addresses of the replicas (one entry per replica in the trust store).
# replica_address: used for the communication among replicas
# client_address: used by clients to contact the replica
node1.replica_address=127.0.0.1:9001
node1.client_address=127.0.0.1:8001
node2.replica_address=127.0.0.1:9002
node2.client_address=127.0.0.1:8002
node3.replica_address=127.0.0.1:9003
node3.client_address=127.0.0.1:8003
node4.replica_address=127.0.0.1:9004
node4.client_address=127.0.0.1:8004

# Initial state (genesis): every client (client1, client2, ...) owns an account
# with its own name; shared accounts are owned by several clients
# (format: name:owner1,owner2;name2:owner3,owner4)
initial_balance=1000000
shared_accounts=shared1:client1,client2;shared2:client3,client4,client5

# Replica parameters
# threads: netty threads shared by the protocols of a replica
threads=4
# event_queue_size: capacity of the event queue of each protocol (events that do
# not fit are dropped by Babel 2, so keep it large)
event_queue_size=65536
# digest_interval: period (ms) of the STATE log line with the digest of the state
digest_interval=5000
# reconnect_interval: period (ms) of the attempts to reconnect to other replicas
reconnect_interval=1000

# Client parameters
# client_mode: automated (load generator) or interactive (console)
client_mode=automated
# client_threads: netty threads of the client process
client_threads=2
# The process emulates clients first_client, ..., first_client + num_clients - 1
first_client=1
num_clients=10
# Operation mix (percentages): transfers, history reads, and balance reads (the rest)
transfer_percentage=80
history_percentage=0
# Percentage of the transfers issued from shared accounts (by clients that own one)
shared_percentage=0
max_amount=10
# Number of matching replies (from different replicas) required to accept a
# result (default: f+1, must be between 1 and the number of replicas)
#reply_quorum=2
operation_timeout=5000
prepare_time=3000
run_time=30000
cooldown_time=5000
results_file=results.csv
label=experiment
